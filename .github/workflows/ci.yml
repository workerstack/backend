name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      bench_mode:
        description: "judge the bench gates, or record their RATIO lines for a re-record (00-rules perf gate)"
        type: choice
        options: [judge, record]
        default: judge
      build_mode:
        description: "judge the e2e build-time ratios, or record their RATIO lines for blueprint/baselines/build.json"
        type: choice
        options: [judge, record]
        default: judge

# a newer push cancels a pull request's run, never main's: each commit on main keeps its own run, the one release.yml
# publishes on when the commit is tagged
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: "1.4.4"

jobs:
  # The Node every other job calls current: the newest RELEASE in nodejs.org's index, resolved once here and fed to
  # each setup-node that is not pinned (a matrix's "current" maps to it). setup-node's own `current` takes the index's
  # top entry, a prerelease the day one ships (CI 40952484194: v27.0.0-alpha.0.0.0); a failed fetch fails the run.
  node-current:
    name: node current
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      node: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - id: resolve
        run: bun packages/core/tests/build/node-current.ts
  commitlint:
    name: commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Lint commit messages
        run: |
          bunx commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose

  check:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run generate
      - run: bun run fmt:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run typecheck:consumers

  # v1 and the bench, then the consumers and e2e. CI calls the root `test` script's parts, each run whatever an
  # earlier one did, as its `;` does; the script itself stays the local run of all of them.
  test:
    name: test
    needs: node-current
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # full history: test:bench reads blueprint/baselines/perf-base.json's pinned commit out of git (is it an
      # ancestor of origin/main, does it carry bun.lock, how far behind is it), and a depth-1 checkout does not hold
      # it. tests/build/perf-base-history.test.ts holds every job that runs those readers to this.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # the integration suites run server fixtures as `node x.ts`: they need Node's type stripping,
      # which the runner image's default Node may not have
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ needs.node-current.outputs.node }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # backend's own copy of the pinned clients (tests/fixture/mcp-clients), for its mounted-MCP legs
      - name: MCP clients for backend (packages/core/tests/fixture/mcp-clients/client-lock.json)
        run: P="$(git rev-parse --show-toplevel)/packages/core/tests/fixture/mcp-clients" && D="$HOME/.cache/honey-tmp/mcp-clients-backend" && rm -rf "$D.partial" && mkdir -p "$D.partial" && cp "$P/client-pins.json" "$D.partial/package.json" && cp "$P/client-lock.json" "$D.partial/package-lock.json" && (cd "$D.partial" && npm ci --ignore-scripts --no-audit --no-fund) && sha256sum "$P/client-lock.json" | cut -d" " -f1 > "$D.partial/lock.sha256" && rm -rf "$D" && mv "$D.partial" "$D"
      - run: bun run generate
      - if: ${{ !cancelled() }}
        run: bun run test:v1
        env:
          # runtime-bundle's legs build with the pinned Bun (packageManager): a missing one fails instead of skipping
          HONEY_REQUIRE_TOOLCHAINS: "1"
      - if: ${{ !cancelled() }}
        run: bun run test:bench
      - run: bun run test:consumers
      - run: bun run test:e2e

  hotpath:
    name: hot-path benchmark
    runs-on: ubuntu-latest
    # bit 21 k-pass: 3 interleaved passes and a 2.6 s round floor. Sized when five steps ran (at the slow runner
    # class, 3.9x local, ~666 s and the rest ~22 s, 688 s x 1.5 = 17.2 min, rounded up); the websockets and adapter
    # steps are gone, so the three left finish well inside it.
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # the runner's CPU model, to tell a per-runner bench level (a ratio cancels speed, not microarchitecture) from a
      # per-process one (a job is one runner and one process)
      - name: cpu
        run: grep -m1 "model name" /proc/cpuinfo
      # Each bench: v1's cost as a ratio to a raw twin doing the same work, judged against its ceiling in
      # blueprint/baselines/bench.json (bench/src/derive-ceilings.ts over CI's own runs: the worst plus 35%, or a
      # 2% false-red tail): that margin is the noise budget, so a red is never retried away. A red with v1 unchanged
      # is answered by a re-record (dispatch this workflow with bench_mode=record, then re-derive), never a rerun.
      - name: hotpath
        run: bun run bench:hotpath
        env:
          BENCH_MODE: ${{ inputs.bench_mode || 'judge' }}
      - name: finalize
        run: bun run bench:finalize
        env:
          BENCH_MODE: ${{ inputs.bench_mode || 'judge' }}
      - name: streaming
        run: bun run bench:streaming
        env:
          BENCH_MODE: ${{ inputs.bench_mode || 'judge' }}

  build:
    name: build (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    # bit 21 bref: each cell times its own 4 references (15,000 units of JS work, ~1.3-1.8 s each). The worst build
    # job of the last 5 CI runs took 5.9 min with its run-build span at most 5.4; that span projects to 10.1 min
    # (CI's own reference ms x the new/old reference ratio measured locally), so ~10.6 min x 1.5 = 15.9, rounded up.
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        runtime: [node]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # the node tier runs the built bundles on the oldest supported Node line, not the image default
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run generate
      # the runner's CPU model, so the build ratios' runner classes can be told by CPU as well as by surface ms (H1)
      - name: cpu
        run: grep -m1 "model name" /proc/cpuinfo
      # --check-generated: the checkout is clean here, so a build that rewrites a
      # committed generated file means it is stale or codegen is not deterministic.
      # each cell's time over a honey-free reference build's, judged against blueprint/baselines/build.json; a
      # dispatch with build_mode=record prints the RATIO lines its ceilings are derived from (build-gate.ts)
      - run: bun packages/core/tests/e2e/run-build.ts --runtime ${{ matrix.runtime }} --check-generated
        env:
          BUILD_MODE: ${{ inputs.build_mode || 'judge' }}

  packaging:
    name: packaging (node ${{ matrix.node }})
    needs: node-current
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # the oldest supported Node (engines.node's floor, an exact pin) and the current release: behavior differs across versions
        node: ["22.12.0", "current"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ (matrix.node || 'current') == 'current' && needs.node-current.outputs.node || matrix.node }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # packs the real tarball, type-checks a consumer with every strictness flag on, then runs
      # it on Bun and on plain Node: the core entry, honey generate, and vite build with the
      # honey plugins. Every other tier runs honey from source, so nothing else can see this.
      - run: bun run test:packaging

  e2e:
    name: e2e (${{ matrix.runtime }}${{ matrix.node && format(' {0}', matrix.node) || '' }}${{ matrix.prod && ' prod' || '' }})
    needs: node-current
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # prod (Q14): run.ts builds each app for workers, then Playwright drives the built bundle, no source.
          # wrangler dev serves the built worker under local workerd, no deploy and no secrets
          - runtime: cf-workers
            prod: true
            script: test:e2e:cf:prod
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # cf-workers still runs node for wrangler, playwright and the type-stripped fixtures
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ (matrix.node || 'current') == 'current' && needs.node-current.outputs.node || matrix.node }}
      - run: bun install --frozen-lockfile
      # backend's own copy of the pinned clients (tests/fixture/mcp-clients), for its mounted-MCP legs
      - name: MCP clients for backend (packages/core/tests/fixture/mcp-clients/client-lock.json)
        run: P="$(git rev-parse --show-toplevel)/packages/core/tests/fixture/mcp-clients" && D="$HOME/.cache/honey-tmp/mcp-clients-backend" && rm -rf "$D.partial" && mkdir -p "$D.partial" && cp "$P/client-pins.json" "$D.partial/package.json" && cp "$P/client-lock.json" "$D.partial/package-lock.json" && (cd "$D.partial" && npm ci --ignore-scripts --no-audit --no-fund) && sha256sum "$P/client-lock.json" | cut -d" " -f1 > "$D.partial/lock.sha256" && rm -rf "$D" && mv "$D.partial" "$D"
      - run: bun run generate
      # a prod cell builds its app through run-build.ts first, under the same build gate as the build job
      - run: bun run ${{ matrix.script }}
        env:
          BUILD_MODE: ${{ inputs.build_mode || 'judge' }}
          HONEY_REQUIRE_TOOLCHAINS: "1"
